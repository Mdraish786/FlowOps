databases:
  - name: flowops-db
    plan: free
    databaseName: flowops
    user: flowops

services:
  - type: web
    name: flowops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: staging
      - key: SERVE_FRONTEND
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: REQUIRE_MFA
        value: "false"
      - key: REQUIRE_MALWARE_SCAN
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/flowops-uploads
